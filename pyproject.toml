[project]
name = "wikipedia-interest-research"
version = "0.1.0"
description = "Agent skill: measure and compare audience interest in topics across Wikipedia language editions."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
]

[project.scripts]
wir = "wir.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wir"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "evals"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real Wikimedia API; run with: uv run pytest -m live",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
